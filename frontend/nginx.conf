server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ─────────────────────────────────────────────────────────────────
    # Security headers (H1 in docs/PRODUCTION_READINESS.md)
    # ─────────────────────────────────────────────────────────────────
    # Clickjacking protection: refuse to be embedded by cross-origin frames.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Disable MIME-type sniffing — stop browsers guessing content types.
    add_header X-Content-Type-Options "nosniff" always;

    # Legacy XSS auditor for older browsers (ignored by modern ones).
    add_header X-XSS-Protection "1; mode=block" always;

    # Only send the origin on cross-origin requests (not full path).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy: disable features the app does not use.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # HSTS — only meaningful when served over HTTPS. 1-year max-age, include subdomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy.
    # - default-src 'self': only same-origin by default
    # - script-src 'self' 'unsafe-inline' 'unsafe-eval': Vite dev mode needs eval;
    #   production builds inline Vite's runtime. Tighten to 'self' in pure-SPA prod.
    # - style-src 'self' 'unsafe-inline' + Google Fonts: Tailwind v4 + Google Fonts.
    # - connect-src 'self' + API origins: VITE_API_URL is inlined at build time;
    #   update when the API domain changes.
    # - img-src 'self' data: https: : allow user-uploaded previews + remote charts.
    # - font-src 'self' + Google Fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' http://localhost:8000 https://*.onrender.com https://*.vercel.app; img-src 'self' data: https: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://ai-analyst-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Proxy WebSocket connections
    location /ws/ {
        proxy_pass http://ai-analyst-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}