version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-analyst-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      # JWT_SECRET MUST be provided at runtime. The backend refuses to start
      # in production without it. Set in your deployment environment.
      - JWT_SECRET=${JWT_SECRET:-dev_fallback_secret_32chars_long_please_override}
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend/datasets:/app/datasets
      - ./backend/reports:/app/reports
      - ./backend/generated_charts:/app/generated_charts
      - ./backend/uploads:/app/uploads
      - ./backend/charts:/app/charts
      - ./backend/cleaned_data:/app/cleaned_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: ai-analyst-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
