name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Import Health
        run: |
          cd backend
          python -c "import app.main; print('Backend modules verified successfully!')"

      - name: Backend Unit Tests
        run: |
          cd backend
          pip install pytest pytest-asyncio pytest-cov httpx
          APP_ENV=testing JWT_SECRET="ci_test_secret_32chars_long_for_ci" \
            pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=50

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Frontend Unit Tests
        run: |
          cd frontend
          npm install
          npx vitest run --reporter=verbose

      - name: Build Production Assets
        run: |
          cd frontend
          npm run build

  e2e-tests:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright & Dependencies
        run: |
          cd frontend
          npm install
          npx playwright install --with-deps chromium

      - name: Start Backend Server
        run: |
          cd backend
          pip install -r requirements.txt
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Start Frontend Dev Server
        run: |
          cd frontend
          npm run dev -- --host 0.0.0.0 --port 5173 &
          sleep 5

      - name: Run Playwright E2E Tests
        run: |
          cd frontend
          npx playwright test --reporter=list

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  docker-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Compose Stack
        run: |
          docker compose build

  security-audit:
    name: Security & Dependency Audit
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit Python dependencies
        continue-on-error: false
        run: |
          cd backend
          pip-audit -r requirements.txt --strict --disable-pip

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Node dependencies
        continue-on-error: false
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Verify .env is not committed
        run: |
          if git ls-files backend/.env 2>/dev/null; then
            echo "::error::backend/.env is tracked in git. Add it to .gitignore and remove from history."
            exit 1
          fi
          echo "OK: backend/.env is not tracked"

      - name: Check for hardcoded secrets
        run: |
          # Fail the build if any hardcoded JWT secret patterns are found outside of test files.
          if grep -rE "(SECRET_KEY|JWT_SECRET|API_KEY)\s*=\s*['\"][A-Za-z0-9_\-]{20,}" backend/app --include="*.py" | grep -v "_resolve_\|test_" ; then
            echo "::error::Hardcoded secret-like literal found in backend/app. Use environment variables."
            exit 1
          fi
          echo "OK: No hardcoded secret literals detected"
